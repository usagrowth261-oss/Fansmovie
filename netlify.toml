# =========================================================
# FansMovie — Netlify deployment configuration
# See SETUP.md "Step 7" for the full deployment walkthrough.
# =========================================================

[build]
  command = "npm run build"
  publish = "."

# No SPA-style catch-all redirect is needed: FansMovie is a plain
# multi-page site (index.html, movies.html, movie.html, ... are all
# real files), not a client-side-routed single-page app. Netlify
# serves each .html file directly. A missing page falls through to
# 404.html automatically (Netlify's default behavior for a file with
# that exact name in the publish directory) — no [[redirects]] rule
# required for that either.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets can be cached aggressively; HTML should always be
# revalidated so deploys/content updates show up immediately.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
